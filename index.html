<script>
    // ==========================================
    // PASUMAI XEROX - WEBSITE CONFIGURATION
    // ==========================================

    const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyejiWHYWpLwyEQZaJUDOHlWjuk1kdKL_4s_uAjNrfi2-92JeOJzC3OEsZg2E4ZAtLKqw/exec";

    const UPI_ID = "kjhari2008@okhdfcbank";
    const BUSINESS_NAME = "Pasumai Xerox";

    // ==========================================
    // STATE
    // ==========================================

    let selectedService = null;
    let selectedPrice = 0;
    let selectedFile = null;
    let fileName = null;

    // ==========================================
    // FILE UPLOAD
    // ==========================================

    function handleFileUpload(event) {
        const file = event.target.files[0];

        if (!file) {
            return;
        }

        // Maximum file size = 10 MB
        const maxFileSize = 10 * 1024 * 1024;

        if (file.size > maxFileSize) {
            alert("File is too large. Maximum size is 10 MB.");

            event.target.value = "";
            selectedFile = null;
            fileName = null;

            document.getElementById("fileItem").style.display = "none";

            return;
        }

        selectedFile = file;
        fileName = file.name;

        document.getElementById("fileName").textContent =
            "✓ " + file.name;

        document.getElementById("fileItem").style.display =
            "flex";
    }

    // ==========================================
    // CLEAR FILE
    // ==========================================

    function clearFile() {
        selectedFile = null;
        fileName = null;

        const fileInput = document.getElementById("fileInput");

        if (fileInput) {
            fileInput.value = "";
        }

        document.getElementById("fileItem").style.display =
            "none";
    }

    // ==========================================
    // SERVICE SELECTION
    // ==========================================

    function selectService(button) {
        if (!button) {
            return;
        }

        document.querySelectorAll(".service-btn").forEach(function(btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedService = button.dataset.service;
        selectedPrice = parseInt(button.dataset.price, 10) || 0;

        calculatePrice();

        clearAlerts();
    }

    function selectServiceFromCard(service, price) {
        const buttons = document.querySelectorAll(".service-btn");

        let selectedButton = null;

        buttons.forEach(function(button) {
            if (button.dataset.service === service) {
                selectedButton = button;
            }
        });

        if (selectedButton) {
            selectService(selectedButton);
        } else {
            selectedService = service;
            selectedPrice = parseInt(price, 10) || 0;
            calculatePrice();
        }

        const nameInput = document.getElementById("customerName");

        if (nameInput) {
            nameInput.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            setTimeout(function() {
                nameInput.focus();
            }, 400);
        }
    }

    // ==========================================
    // COPIES
    // ==========================================

    function incrementCopies() {
        const input = document.getElementById("copiesInput");

        if (!input) {
            return;
        }

        let copies = parseInt(input.value, 10) || 1;

        copies++;

        input.value = copies;

        calculatePrice();
    }

    function decrementCopies() {
        const input = document.getElementById("copiesInput");

        if (!input) {
            return;
        }

        let copies = parseInt(input.value, 10) || 1;

        if (copies > 1) {
            copies--;

            input.value = copies;

            calculatePrice();
        }
    }

    // ==========================================
    // PRICE CALCULATION
    // ==========================================

    function calculatePrice() {
        const copiesInput =
            document.getElementById("copiesInput");

        const copies =
            Math.max(
                1,
                parseInt(copiesInput.value, 10) || 1
            );

        copiesInput.value = copies;

        const total =
            selectedPrice * copies;

        document.getElementById("summaryService").textContent =
            selectedService || "None";

        document.getElementById("summaryPrice").textContent =
            selectedPrice;

        document.getElementById("summaryQuantity").textContent =
            copies;

        document.getElementById("totalAmount").textContent =
            total;

        const paymentButton =
            document.getElementById("paymentBtn");

        paymentButton.disabled =
            !selectedService || selectedPrice <= 0 || copies < 1;
    }

    // ==========================================
    // PAYMENT / ORDER START
    // ==========================================

    function initiatePayment() {
        clearAlerts();

        const name =
            document.getElementById("customerName")
                .value
                .trim();

        const phone =
            document.getElementById("customerPhone")
                .value
                .trim();

        const copies =
            parseInt(
                document.getElementById("copiesInput").value,
                10
            );

        const printingSides =
            document.getElementById("printingSides").value;

        const instructions =
            document.getElementById("instructions")
                .value
                .trim();

        // Validate name
        if (!name) {
            showError("Please enter your name.");
            return;
        }

        // Validate phone
        if (!/^[0-9]{10}$/.test(phone)) {
            showError("Please enter a valid 10-digit phone number.");
            return;
        }

        // Validate service
        if (!selectedService || selectedPrice <= 0) {
            showError("Please select a service.");
            return;
        }

        // Validate copies
        if (!copies || copies < 1) {
            showError("Number of copies must be at least 1.");
            return;
        }

        const total =
            selectedPrice * copies;

        // Create order data
        const orderData = {
            name: name,
            phone: phone,
            service: selectedService,
            copies: copies,
            printingSides: printingSides,
            instructions: instructions,
            estimatedTotal: total.toString()
        };

        // UPI payment URL
        const upiURL =
            "upi://pay" +
            "?pa=" + encodeURIComponent(UPI_ID) +
            "&pn=" + encodeURIComponent(BUSINESS_NAME) +
            "&am=" + encodeURIComponent(total) +
            "&cu=INR";

        saveOrderAndPay(
            orderData,
            upiURL,
            total
        );
    }

    // ==========================================
    // SAVE ORDER + UPLOAD FILE
    // ==========================================

    function saveOrderAndPay(orderData, upiURL, amount) {
        const payBtn =
            document.getElementById("paymentBtn");

        payBtn.disabled = true;

        const originalText =
            payBtn.innerHTML;

        payBtn.innerHTML =
            '<span class="loading-spinner"></span> Uploading...';

        const formData =
            new URLSearchParams();

        // Basic order information
        formData.append(
            "name",
            orderData.name
        );

        formData.append(
            "phone",
            orderData.phone
        );

        formData.append(
            "service",
            orderData.service
        );

        formData.append(
            "copies",
            orderData.copies
        );

        // Printing sides
        formData.append(
            "printingSides",
            orderData.printingSides || "Single Sided"
        );

        // Instructions
        formData.append(
            "instructions",
            orderData.instructions || ""
        );

        // Estimated total
        formData.append(
            "estimatedTotal",
            orderData.estimatedTotal
        );

        // ==========================================
        // SEND TO GOOGLE APPS SCRIPT
        // ==========================================

        function sendToAppsScript() {
            fetch(
                APPS_SCRIPT_URL,
                {
                    method: "POST",
                    mode: "no-cors",
                    body: formData
                }
            )
            .then(function() {
                handleUploadSuccess(
                    originalText,
                    upiURL,
                    amount,
                    payBtn
                );
            })
            .catch(function(error) {
                handleUploadError(
                    error,
                    originalText,
                    payBtn
                );
            });
        }

        // ==========================================
        // IF FILE IS SELECTED
        // ==========================================

        if (selectedFile) {
            const reader =
                new FileReader();

            reader.onload =
                function(event) {
                    const base64Data =
                        event.target.result;

                    formData.append(
                        "fileName",
                        selectedFile.name
                    );

                    formData.append(
                        "fileMimeType",
                        selectedFile.type ||
                        "application/octet-stream"
                    );

                    formData.append(
                        "fileData",
                        base64Data
                    );

                    sendToAppsScript();
                };

            reader.onerror =
                function(error) {
                    handleUploadError(
                        error,
                        originalText,
                        payBtn
                    );
                };

            reader.readAsDataURL(selectedFile);

        } else {
            // No file selected
            sendToAppsScript();
        }
    }

    // ==========================================
    // SUCCESS
    // ==========================================

    function handleUploadSuccess(
        originalText,
        upiURL,
        amount,
        payBtn
    ) {
        showSuccess(
            "✓ Order saved! Amount: ₹" + amount
        );

        // Give Apps Script a moment before opening UPI
        setTimeout(function() {
            const opened =
                tryOpenUPI(
                    upiURL,
                    amount
                );

            if (!opened) {
                showUPIFallback();
            }
        }, 800);

        // Reset after payment attempt
        setTimeout(function() {
            resetForm();

            payBtn.innerHTML =
                originalText;

            payBtn.disabled = false;
        }, 3500);
    }

    // ==========================================
    // ERROR
    // ==========================================

    function handleUploadError(
        error,
        originalText,
        payBtn
    ) {
        console.error(
            "Order upload error:",
            error
        );

        showError(
            "Could not upload the order. Please check your internet connection and try again."
        );

        payBtn.innerHTML =
            originalText;

        payBtn.disabled = false;
    }

    // ==========================================
    // TRY TO OPEN UPI
    // ==========================================

    function tryOpenUPI(upiURL, amount) {
        try {
            const isMobile =
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
                .test(navigator.userAgent);

            if (isMobile) {
                window.location.href = upiURL;

                return true;
            }

            return false;

        } catch (error) {
            console.error(
                "UPI open error:",
                error
            );

            return false;
        }
    }

    // ==========================================
    // UPI FALLBACK FOR DESKTOP
    // ==========================================

    function showUPIFallback() {
        const amount =
            document.getElementById("totalAmount")
                .textContent;

        // Remove previous fallback if it exists
        const oldFallback =
            document.getElementById("upiFallback");

        if (oldFallback) {
            oldFallback.remove();
        }

        const fallback =
            document.createElement("div");

        fallback.id =
            "upiFallback";

        fallback.innerHTML = `
            <div style="
                background: linear-gradient(135deg, #fef08a 0%, #fcd34d 100%);
                padding: 20px;
                border-radius: 8px;
                border: 2px solid #fbbf24;
                margin-top: 16px;
                color: #78350f;
            ">

                <h4 style="
                    margin-bottom: 12px;
                    font-weight: 700;
                    font-size: 16px;
                ">
                    💳 Complete Payment
                </h4>

                <p style="
                    margin-bottom: 12px;
                    font-size: 14px;
                    line-height: 1.6;
                ">
                    <strong>UPI ID:</strong>

                    <code style="
                        background: rgba(0,0,0,0.1);
                        padding: 6px 10px;
                        border-radius: 4px;
                        font-family: monospace;
                        font-size: 13px;
                    ">
                        ${UPI_ID}
                    </code>
                </p>

                <p style="
                    margin-bottom: 12px;
                    font-size: 14px;
                    line-height: 1.6;
                ">
                    <strong>Business:</strong>
                    ${BUSINESS_NAME}
                    &nbsp; | &nbsp;
                    <strong>Amount:</strong>
                    ₹${amount}
                </p>

                <p style="
                    margin: 0;
                    font-size: 12px;
                    opacity: 0.9;
                ">
                    ✓ Order saved! Open your UPI app and pay
                    ₹${amount} to complete the transaction.
                </p>

            </div>
        `;

        const formSection =
            document.querySelector(".form-section");

        if (formSection) {
            formSection.appendChild(fallback);
        }
    }

    // ==========================================
    // SUCCESS ALERT
    // ==========================================

    function showSuccess(message) {
        const successAlert =
            document.getElementById("successAlert");

        const errorAlert =
            document.getElementById("errorAlert");

        errorAlert.classList.remove("show");

        successAlert.textContent =
            message;

        successAlert.classList.add("show");

        setTimeout(function() {
            successAlert.classList.remove("show");
        }, 5000);
    }

    // ==========================================
    // ERROR ALERT
    // ==========================================

    function showError(message) {
        const successAlert =
            document.getElementById("successAlert");

        const errorAlert =
            document.getElementById("errorAlert");

        successAlert.classList.remove("show");

        errorAlert.textContent =
            "❌ " + message;

        errorAlert.classList.add("show");

        setTimeout(function() {
            errorAlert.classList.remove("show");
        }, 5000);
    }

    // ==========================================
    // CLEAR ALERTS
    // ==========================================

    function clearAlerts() {
        const successAlert =
            document.getElementById("successAlert");

        const errorAlert =
            document.getElementById("errorAlert");

        successAlert.classList.remove("show");
        errorAlert.classList.remove("show");
    }

    // ==========================================
    // RESET FORM
    // ==========================================

    function resetForm() {
        const form =
            document.getElementById("orderForm");

        form.reset();

        document.querySelectorAll(".service-btn")
            .forEach(function(button) {
                button.classList.remove("active");
            });

        document.getElementById("copiesInput").value =
            "1";

        document.getElementById("fileItem").style.display =
            "none";

        // Reset file input completely
        document.getElementById("fileInput").value =
            "";

        // Reset state
        selectedFile = null;
        fileName = null;
        selectedService = null;
        selectedPrice = 0;

        // Remove UPI fallback
        const fallback =
            document.getElementById("upiFallback");

        if (fallback) {
            fallback.remove();
        }

        calculatePrice();
    }

    // ==========================================
    // INITIALIZE WEBSITE
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {
            calculatePrice();
        }
    );

</script>
